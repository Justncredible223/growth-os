<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilt Live Stage</title>
<!--
  The Live Host stage: what viewers see. A 1080x1920 portrait scene with Tilt, the chat bubble he is answering,
  word-by-word captions and the on-screen cards. OBS shows this page as a Browser Source (which also captures
  its audio) and pushes it to the stream. The worker (../worker.ts) serves this file and drives it over
  /events; open it with ?demo=1 to watch a scripted run with no worker, no audio and no network.
  Everything is inline on purpose: one file, no build step, nothing fetched from the internet while live.
-->
<style>
  :root {
    --bg0: #060b16; --bg1: #0b1424; --bg2: #101d33;
    --ink: #f3f7ff; --ink2: #9fb0cc; --ink3: #5d6f8f;
    --accent: #22d3ee; --accent2: #0ea5b7; --up: #2dd4a7; --down: #ff5d73; --warn: #ffb547;
    --card: rgba(16, 27, 48, 0.86); --line: rgba(120, 160, 220, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Segoe UI", "Inter", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); }

  /* The scene is authored at 1080x1920 and scaled to fit whatever it is shown in. */
  #viewport { position: fixed; inset: 0; overflow: hidden; }
  #scene {
    position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; margin: -960px 0 0 -540px; overflow: hidden; transform-origin: center center;
    background:
      radial-gradient(1200px 900px at 50% 38%, rgba(34, 211, 238, 0.13), transparent 62%),
      radial-gradient(900px 700px at 85% 95%, rgba(45, 212, 167, 0.08), transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
  }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(2, 5, 12, 0.72) 100%); pointer-events: none; }

  /* ---- top bar ---- */
  .topbar { position: absolute; top: 56px; left: 56px; right: 56px; display: flex; align-items: center; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 40px; letter-spacing: 0.5px; }
  .brand svg { width: 60px; height: 60px; }
  .brand small { display: block; font-size: 20px; font-weight: 600; color: var(--ink2); letter-spacing: 3px; margin-top: 2px; }
  .spacer { flex: 1; }
  .badge { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font-size: 24px; font-weight: 800; letter-spacing: 2px; border: 2px solid var(--line); background: rgba(10, 18, 34, 0.7); }
  .badge.live { color: #fff; background: #e11d48; border-color: #ff6b88; }
  .badge.live i { width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
  .badge.ai { color: var(--accent); border-color: rgba(34, 211, 238, 0.5); }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }

  .segment { position: absolute; top: 172px; left: 56px; padding: 14px 26px; border-radius: 18px; background: linear-gradient(90deg, var(--accent), var(--up)); color: #04121c; font-weight: 900; font-size: 34px; letter-spacing: 1px; text-transform: uppercase; opacity: 0; transform: translateX(-700px); transition: transform 0.55s cubic-bezier(.2, .9, .2, 1.1), opacity 0.3s ease; box-shadow: 0 14px 40px rgba(34, 211, 238, 0.25); }
  .segment.show { opacity: 1; transform: translateX(0); }

  /* ---- chat bubble (the question being answered) ---- */
  .asks { position: absolute; top: 280px; left: 56px; right: 56px; display: flex; flex-direction: column; gap: 16px; }
  .ask { align-self: flex-start; max-width: 880px; padding: 22px 30px 26px; border-radius: 28px 28px 28px 8px; background: var(--card); border: 2px solid var(--line); backdrop-filter: blur(8px); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); opacity: 0; transform: translateY(26px) scale(0.96); transition: opacity 0.35s ease, transform 0.45s cubic-bezier(.2, .9, .2, 1.15); }
  .ask.show { opacity: 1; transform: none; }
  .ask .who { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  .ask .who .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--up); }
  .ask .who .dot.youtube { background: #ff4d4d; }
  .ask .who .dot.tiktok { background: #25f4ee; }
  .ask .who span.plat { font-size: 20px; font-weight: 700; color: var(--ink3); letter-spacing: 2px; text-transform: uppercase; }
  .ask .text { font-size: 38px; line-height: 1.25; font-weight: 600; }

  /* ---- Tilt ---- */
  #tiltWrap { position: absolute; left: 50%; top: 650px; width: 640px; height: 741px; margin-left: -320px; }
  #tilt { width: 100%; height: 100%; overflow: visible; }
  #floor { position: absolute; left: 50%; top: 1330px; width: 520px; height: 60px; margin-left: -260px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), transparent); }

  /* ---- captions ---- */
  .captions { position: absolute; left: 56px; right: 56px; top: 1500px; min-height: 230px; display: flex; align-items: flex-start; justify-content: center; }
  .captions p { margin: 0; text-align: center; font-size: 58px; line-height: 1.25; font-weight: 800; letter-spacing: 0.2px; text-shadow: 0 4px 22px rgba(0, 0, 0, 0.85), 0 0 2px #000; }
  .captions .w { color: rgba(243, 247, 255, 0.62); transition: color 0.12s linear; }
  .captions .w.said { color: var(--ink); }
  .captions .w.now { color: var(--accent); }

  /* ---- verdict card + tilt-o-meter ---- */
  .card { position: absolute; right: 40px; top: 1120px; width: 330px; padding: 22px 24px; border-radius: 26px; background: var(--card); border: 2px solid rgba(34, 211, 238, 0.45); box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5); transform: translateX(130%) rotate(4deg); transition: transform 0.6s cubic-bezier(.2, .9, .2, 1.1); }
  .card.show { transform: translateX(0) rotate(2deg); }
  .card h3 { margin: 0 0 14px; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  .card li { list-style: none; font-size: 27px; line-height: 1.25; font-weight: 700; padding: 10px 0; border-top: 1px solid var(--line); }
  .card ul { margin: 0; padding: 0; }
  .meter { position: absolute; left: 40px; top: 1090px; width: 300px; padding: 18px; border-radius: 26px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5); transform: translateX(-140%); transition: transform 0.6s cubic-bezier(.2, .9, .2, 1.1); text-align: center; }
  .meter.show { transform: translateX(0); }
  .meter h3 { margin: 0 0 6px; font-size: 24px; letter-spacing: 3px; color: var(--ink2); }
  .meter .num { font-size: 74px; font-weight: 900; line-height: 1; }
  .meter .num small { font-size: 30px; color: var(--ink3); font-weight: 700; }
  #needle { transform-origin: 140px 140px; transition: transform 1.1s cubic-bezier(.3, 1.6, .4, 1); }

  /* ---- footer ---- */
  .footer { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font-size: 26px; font-weight: 600; color: var(--ink2); letter-spacing: 0.4px; }
  .footer b { color: var(--ink); }
  .footer .fine { display: block; margin-top: 8px; font-size: 21px; color: var(--ink3); }

  .offline { position: absolute; inset: 0; display: none; place-items: center; background: rgba(4, 8, 16, 0.86); text-align: center; font-size: 46px; font-weight: 800; }
  .offline.show { display: grid; }
  .offline small { display: block; margin-top: 14px; font-size: 28px; color: var(--ink2); font-weight: 600; }
</style>
</head>
<body>
<div id="viewport">
  <div id="scene">
    <canvas id="chart" width="1080" height="1920"></canvas>
    <div class="vignette"></div>

    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <rect width="60" height="60" rx="16" fill="#0d1a2e"/>
          <rect x="13" y="12" width="6" height="34" rx="3" fill="#1596a8"/>
          <rect x="24" y="30" width="6" height="16" rx="3" fill="#22d3ee"/>
          <rect x="34" y="22" width="8" height="26" rx="4" fill="none" stroke="#22d3ee" stroke-width="3.5"/>
          <rect x="46" y="14" width="6" height="32" rx="3" fill="#22d3ee"/>
        </svg>
        <div>Fillbook Live<small>WITH TILT</small></div>
      </div>
      <div class="spacer"></div>
      <div class="badge ai">AI HOST</div>
      <div class="badge live"><i></i>LIVE</div>
    </div>

    <div class="segment" id="segment"></div>
    <div class="asks" id="asks"></div>

    <div id="floor"></div>
    <div id="tiltWrap">
      <!-- Tilt: a candlestick with a face. Body colour, brows, lids and mouth are driven from script below. -->
      <svg id="tilt" viewBox="0 0 760 880" aria-label="Tilt">
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
            <stop id="g0" offset="0" stop-color="#5ff2d0"/>
            <stop id="g1" offset="0.55" stop-color="#22d3ee"/>
            <stop id="g2" offset="1" stop-color="#0b8fa6"/>
          </linearGradient>
          <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="26" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="eyeClipL"><ellipse cx="292" cy="372" rx="62" ry="70"/></clipPath>
          <clipPath id="eyeClipR"><ellipse cx="468" cy="372" rx="62" ry="70"/></clipPath>
        </defs>

        <g id="rig">
          <!-- wicks -->
          <rect id="wickTop" x="368" y="34" width="24" height="150" rx="12" fill="#bff6ff"/>
          <rect x="368" y="700" width="24" height="120" rx="12" fill="#0b8fa6"/>
          <!-- arms (behind body) -->
          <g id="armL"><path d="M214 470 C150 480 118 530 128 590" fill="none" stroke="#0b8fa6" stroke-width="30" stroke-linecap="round"/><circle cx="128" cy="596" r="26" fill="#22d3ee"/></g>
          <g id="armR"><path d="M546 470 C610 480 642 530 632 590" fill="none" stroke="#0b8fa6" stroke-width="30" stroke-linecap="round"/><circle cx="632" cy="596" r="26" fill="#22d3ee"/></g>
          <!-- body -->
          <g filter="url(#glow)"><rect id="body" x="200" y="170" width="360" height="548" rx="84" fill="url(#bodyGrad)"/></g>
          <rect x="226" y="198" width="92" height="470" rx="46" fill="url(#shine)"/>
          <!-- cheeks -->
          <ellipse id="cheekL" cx="250" cy="470" rx="34" ry="20" fill="#ff8fa3" opacity="0.0"/>
          <ellipse id="cheekR" cx="510" cy="470" rx="34" ry="20" fill="#ff8fa3" opacity="0.0"/>
          <!-- eyes -->
          <g id="eyes">
            <ellipse cx="292" cy="372" rx="62" ry="70" fill="#fff"/>
            <ellipse cx="468" cy="372" rx="62" ry="70" fill="#fff"/>
            <g clip-path="url(#eyeClipL)"><g id="pupilL"><circle cx="292" cy="378" r="32" fill="#071421"/><circle cx="303" cy="365" r="11" fill="#fff"/></g><rect id="lidL" x="226" y="298" width="132" height="0" fill="#16b6cf"/><rect id="lidLb" x="226" y="446" width="132" height="0" fill="#16b6cf"/></g>
            <g clip-path="url(#eyeClipR)"><g id="pupilR"><circle cx="468" cy="378" r="32" fill="#071421"/><circle cx="479" cy="365" r="11" fill="#fff"/></g><rect id="lidR" x="402" y="298" width="132" height="0" fill="#16b6cf"/><rect id="lidRb" x="402" y="446" width="132" height="0" fill="#16b6cf"/></g>
          </g>
          <!-- brows -->
          <path id="browL" d="M236 290 Q292 262 348 286" fill="none" stroke="#063447" stroke-width="16" stroke-linecap="round"/>
          <path id="browR" d="M412 286 Q468 262 524 290" fill="none" stroke="#063447" stroke-width="16" stroke-linecap="round"/>
          <!-- mouth -->
          <g id="mouthG">
            <path id="mouth" d="M320 520 Q380 548 440 520 Q380 548 320 520 Z" fill="#06202d" stroke="#06202d" stroke-width="10" stroke-linejoin="round"/>
            <path id="tongue" d="" fill="#ff6f8a"/>
          </g>
          <!-- sweat drop for "tilted" / "shocked" -->
          <path id="sweat" d="M560 250 C548 276 540 290 552 304 C566 316 584 302 576 282 C572 270 566 262 560 250 Z" fill="#bff6ff" opacity="0"/>
        </g>
      </svg>
    </div>

    <div class="meter" id="meter">
      <h3>TILT-O-METER</h3>
      <svg viewBox="0 0 280 160" width="252" height="144">
        <path d="M20 140 A120 120 0 0 1 260 140" fill="none" stroke="#1b2a45" stroke-width="22" stroke-linecap="round"/>
        <path d="M20 140 A120 120 0 0 1 100 34" fill="none" stroke="#2dd4a7" stroke-width="22" stroke-linecap="round"/>
        <path d="M100 34 A120 120 0 0 1 200 40" fill="none" stroke="#ffb547" stroke-width="22"/>
        <path d="M200 40 A120 120 0 0 1 260 140" fill="none" stroke="#ff5d73" stroke-width="22" stroke-linecap="round"/>
        <g id="needle"><path d="M140 140 L134 138 L140 40 L146 138 Z" fill="#f3f7ff"/></g>
        <circle cx="140" cy="140" r="14" fill="#f3f7ff"/>
      </svg>
      <div class="num"><span id="meterNum">0</span><small>/10</small></div>
    </div>

    <div class="card" id="card"><h3 id="cardTitle"></h3><ul id="cardLines"></ul></div>

    <div class="captions"><p id="caption"></p></div>

    <div class="footer">
      <b>Ask anything in chat</b> &nbsp;·&nbsp; rules, drawdown, journaling, or confess a trade
      <span class="fine">Tilt is an AI character. Education and entertainment only, not financial advice.</span>
    </div>

    <div class="offline" id="offline"><div>Tilt is off air<small>Waiting for the Live Host worker</small></div></div>
  </div>
</div>
<audio id="voice" preload="auto"></audio>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const DEMO = params.has("demo");

  // ---- fit the 1080x1920 scene to the window ----
  const scene = $("scene");
  function fit() {
    const scale = Math.min(innerWidth / 1080, innerHeight / 1920);
    scene.style.transform = `scale(${scale})`;
  }
  addEventListener("resize", fit);
  fit();

  // ---- background: a slow candlestick chart ----
  const chart = $("chart");
  const ctx = chart.getContext("2d");
  const candles = [];
  let price = 100;
  function rand(seedless) { return Math.random(); }
  function pushCandle() {
    const open = price;
    const drift = (rand() - 0.48) * 6;
    const close = Math.max(40, Math.min(160, open + drift));
    const high = Math.max(open, close) + rand() * 3;
    const low = Math.min(open, close) - rand() * 3;
    price = close;
    candles.push({ open, close, high, low });
    if (candles.length > 46) candles.shift();
  }
  for (let i = 0; i < 46; i++) pushCandle();
  let chartOffset = 0;
  function drawChart(dt) {
    chartOffset += dt * 0.012;
    const step = 26;
    if (chartOffset >= step) { chartOffset -= step; pushCandle(); }
    ctx.clearRect(0, 0, 1080, 1920);
    ctx.strokeStyle = "rgba(120,160,220,0.07)";
    ctx.lineWidth = 2;
    for (let y = 300; y < 1500; y += 150) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1080, y); ctx.stroke(); }
    const lo = Math.min(...candles.map((c) => c.low)), hi = Math.max(...candles.map((c) => c.high));
    const yOf = (p) => 1380 - ((p - lo) / Math.max(1, hi - lo)) * 900;
    candles.forEach((c, i) => {
      const x = i * step - chartOffset - 40;
      const up = c.close >= c.open;
      ctx.strokeStyle = ctx.fillStyle = up ? "rgba(45,212,167,0.55)" : "rgba(255,93,115,0.5)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + 8, yOf(c.high)); ctx.lineTo(x + 8, yOf(c.low)); ctx.stroke();
      const top = yOf(Math.max(c.open, c.close)), bottom = yOf(Math.min(c.open, c.close));
      ctx.fillRect(x, top, 16, Math.max(4, bottom - top));
    });
  }

  // ---- Tilt's rig ----
  const MOODS = {
    //            body colours                     brow tilt  lid  lowerLid cheeks sweat pupil(dx,dy) smile
    neutral:  { c: ["#5ff2d0", "#22d3ee", "#0b8fa6"], brow: 0,   lid: 0.06, low: 0,    cheek: 0,    sweat: 0, px: 0,   py: 0,  smile: 0.35 },
    smirk:    { c: ["#5ff2d0", "#22d3ee", "#0b8fa6"], brow: -8,  lid: 0.26, low: 0.1,  cheek: 0.25, sweat: 0, px: 8,   py: 2,  smile: 0.8 },
    proud:    { c: ["#8cf7b8", "#2dd4a7", "#0a8f73"], brow: -4,  lid: 0.12, low: 0.3,  cheek: 0.6,  sweat: 0, px: 0,   py: -2, smile: 1 },
    thinking: { c: ["#7fdcff", "#3aa9f0", "#1763b8"], brow: 6,   lid: 0.18, low: 0,    cheek: 0,    sweat: 0, px: -12, py: -14, smile: 0.05 },
    shocked:  { c: ["#ffe08a", "#ffb547", "#d97706"], brow: -18, lid: 0,    low: 0,    cheek: 0,    sweat: 1, px: 0,   py: 0,  smile: -0.2 },
    tilted:   { c: ["#ff9aa9", "#ff5d73", "#c81e45"], brow: 16,  lid: 0.2,  low: 0.12, cheek: 0.4,  sweat: 1, px: 0,   py: 4,  smile: -0.7 },
  };
  const state = { mood: "neutral", cur: { ...MOODS.neutral, c: [...MOODS.neutral.c] }, mouthOpen: 0, targetOpen: 0, blink: 0, nextBlink: 2, talking: false, gesture: 0 };

  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mixHex = (a, b, t) => { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
  const lerp = (a, b, t) => a + (b - a) * t;

  function setMood(mood) { state.mood = MOODS[mood] ? mood : "neutral"; }

  function drawTilt(t, dt) {
    const target = MOODS[state.mood];
    const k = Math.min(1, dt * 0.006);
    const cur = state.cur;
    for (const key of ["brow", "lid", "low", "cheek", "sweat", "px", "py", "smile"]) cur[key] = lerp(cur[key], target[key], k);
    cur.c = cur.c.map((c, i) => mixHex(c, target.c[i], k));
    $("g0").setAttribute("stop-color", cur.c[0]); $("g1").setAttribute("stop-color", cur.c[1]); $("g2").setAttribute("stop-color", cur.c[2]);

    // idle float + talking bounce
    state.mouthOpen = lerp(state.mouthOpen, state.targetOpen, Math.min(1, dt * 0.03));
    const bob = Math.sin(t / 900) * 10;
    const talk = state.mouthOpen;
    const squash = 1 + talk * 0.018;
    const lean = Math.sin(t / 1700) * 1.6 + (state.talking ? Math.sin(t / 260) * 1.1 : 0) + (state.mood === "tilted" ? Math.sin(t / 55) * 0.8 : 0);
    $("rig").setAttribute("transform", `translate(380 ${440 + bob}) rotate(${lean}) scale(${1 / squash} ${squash}) translate(-380 -440)`);
    $("floor").style.transform = `scale(${1 - bob / 160})`;

    // arms: gentle sway, bigger while talking
    const arm = Math.sin(t / 620) * (state.talking ? 13 : 5);
    $("armL").setAttribute("transform", `rotate(${arm + state.gesture * 26} 214 470)`);
    $("armR").setAttribute("transform", `rotate(${-arm * 0.8 - state.gesture * 34} 546 470)`);
    state.gesture = lerp(state.gesture, 0, Math.min(1, dt * 0.004));

    // blink
    state.nextBlink -= dt / 1000;
    if (state.nextBlink <= 0) { state.blink = 1; state.nextBlink = 2.2 + Math.random() * 3.2; }
    state.blink = Math.max(0, state.blink - dt / 130);
    const blinkAmt = state.blink > 0.5 ? (1 - state.blink) * 2 : state.blink * 2;
    const lid = Math.min(1, cur.lid + blinkAmt);
    const lidH = 148 * lid;
    for (const id of ["lidL", "lidR"]) $(id).setAttribute("height", lidH.toFixed(1));
    const lowH = 60 * cur.low;
    for (const id of ["lidLb", "lidRb"]) { $(id).setAttribute("height", lowH.toFixed(1)); $(id).setAttribute("y", (446 - lowH).toFixed(1)); }
    const lidCol = mixHex(cur.c[1], "#0a5d70", 0.25);
    for (const id of ["lidL", "lidR", "lidLb", "lidRb"]) $(id).setAttribute("fill", lidCol);

    // pupils wander a little, look where the mood says
    const wx = Math.sin(t / 1300) * 5 + cur.px, wy = Math.cos(t / 1700) * 4 + cur.py;
    $("pupilL").setAttribute("transform", `translate(${wx} ${wy})`);
    $("pupilR").setAttribute("transform", `translate(${wx} ${wy})`);

    // brows
    const b = cur.brow;
    $("browL").setAttribute("d", `M236 ${290 - b} Q292 ${262 - Math.abs(b) * 0.2} 348 ${286 + b}`);
    $("browR").setAttribute("d", `M412 ${286 + b} Q468 ${262 - Math.abs(b) * 0.2} 524 ${290 - b}`);
    const browCol = mixHex(cur.c[2], "#04121c", 0.55);
    $("browL").setAttribute("stroke", browCol); $("browR").setAttribute("stroke", browCol);

    // mouth: a smile curve when shut, an opening shape driven by the voice when talking
    const open = talk * 78;
    const smile = cur.smile * 30;
    const w = 60 + talk * 8 - Math.max(0, -cur.smile) * 8;
    const cx = 380, cy = 526;
    const upper = cy - open * 0.28 + Math.max(0, smile) * 0.25;
    const lower = cy + open + smile;
    $("mouth").setAttribute("d", `M${cx - w} ${cy} Q${cx} ${upper} ${cx + w} ${cy} Q${cx} ${lower + 6} ${cx - w} ${cy} Z`);
    $("tongue").setAttribute("d", open > 22 ? `M${cx - w * 0.5} ${cy + open * 0.62} Q${cx} ${cy + open * 0.38} ${cx + w * 0.5} ${cy + open * 0.62} Q${cx} ${lower} ${cx - w * 0.5} ${cy + open * 0.62} Z` : "");

    $("cheekL").setAttribute("opacity", (cur.cheek * 0.75).toFixed(2));
    $("cheekR").setAttribute("opacity", (cur.cheek * 0.75).toFixed(2));
    $("sweat").setAttribute("opacity", cur.sweat.toFixed(2));
    $("sweat").setAttribute("transform", `translate(0 ${(t / 14) % 60})`);
    $("wickTop").setAttribute("fill", mixHex(cur.c[0], "#ffffff", 0.45));
  }

  // ---- voice: real audio drives the mouth; demo mode fakes it from the word timings ----
  const voice = $("voice");
  let analyser = null, levels = null, audioCtx = null;
  function ensureAnalyser() {
    if (analyser || DEMO) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(voice);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      levels = new Uint8Array(analyser.fftSize);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    } catch (err) { analyser = null; }
  }
  function voiceLevel() {
    if (!analyser) return 0;
    analyser.getByteTimeDomainData(levels);
    let sum = 0;
    for (let i = 0; i < levels.length; i++) { const v = (levels[i] - 128) / 128; sum += v * v; }
    return Math.min(1, Math.sqrt(sum / levels.length) * 4.2);
  }

  // ---- captions ----
  let current = null; // { id, words:[{text,start,end}], startedAt, duration, spans }
  function showCaption(words) {
    const p = $("caption");
    p.textContent = "";
    return words.map((word, i) => {
      const span = document.createElement("span");
      span.className = "w";
      span.textContent = word.text + (i < words.length - 1 ? " " : "");
      p.appendChild(span);
      return span;
    });
  }
  /**
   * Captions are shown one phrase at a time and each phrase stays put while it is spoken: only the highlight
   * moves. (A window that slid forward on every word made the whole block reflow constantly and was hard to
   * read.) A phrase ends at sentence punctuation, or when it would no longer fit on two lines.
   */
  const CAPTION_MAX_CHARS = 52;
  const CAPTION_MAX_WORDS = 9;
  function captionPhrases(words) {
    const phraseOf = [];
    let phrase = 0, chars = 0, count = 0;
    words.forEach((word, i) => {
      const length = word.text.length + 1;
      if (count > 0 && (chars + length > CAPTION_MAX_CHARS || count >= CAPTION_MAX_WORDS)) { phrase++; chars = 0; count = 0; }
      phraseOf[i] = phrase;
      chars += length; count++;
      if (/[.!?]["')]?$/.test(word.text) && count >= 3) { phrase++; chars = 0; count = 0; }
    });
    return phraseOf;
  }
  function updateCaption(seconds) {
    if (!current) return;
    const { words, spans } = current;
    if (!current.phraseOf) current.phraseOf = captionPhrases(words);
    let now = words.findIndex((w) => seconds < w.end);
    if (now === -1) now = words.length - 1;
    // Hold a finished phrase on screen through the pause before the next one starts.
    const next = words[now];
    const showing = now > 0 && seconds < next.start - 0.12 ? current.phraseOf[now - 1] : current.phraseOf[now];
    spans.forEach((span, i) => {
      span.style.display = current.phraseOf[i] === showing ? "" : "none";
      span.classList.toggle("said", i < now);
      span.classList.toggle("now", i === now && seconds >= words[i].start - 0.05);
    });
  }
  /** When the worker has no word timings, spread the words evenly over the line. */
  function estimateWords(text, duration) {
    const parts = text.split(/\s+/).filter(Boolean);
    const total = parts.reduce((n, w) => n + w.length + 1, 0);
    let at = 0;
    return parts.map((w) => { const len = ((w.length + 1) / total) * duration; const cue = { text: w, start: at, end: at + len }; at += len; return cue; });
  }

  // ---- showing one line ----
  function clearProps() {
    $("card").classList.remove("show");
    $("meter").classList.remove("show");
    document.querySelectorAll(".ask").forEach((el) => el.classList.remove("show"));
    setTimeout(() => { if (!current) $("asks").textContent = ""; }, 500);
  }
  function showAsks(replyingTo) {
    const box = $("asks");
    box.textContent = "";
    (replyingTo || []).slice(0, 2).forEach((item, i) => {
      const el = document.createElement("div");
      el.className = "ask";
      const who = document.createElement("div"); who.className = "who";
      const dot = document.createElement("i"); dot.className = "dot " + (item.platform || "");
      const name = document.createElement("span"); name.textContent = item.authorName;
      const plat = document.createElement("span"); plat.className = "plat"; plat.textContent = item.platform || "";
      who.append(dot, name, plat);
      const text = document.createElement("div"); text.className = "text"; text.textContent = item.body.length > 140 ? item.body.slice(0, 137) + "..." : item.body;
      el.append(who, text);
      box.appendChild(el);
      setTimeout(() => el.classList.add("show"), 60 + i * 140);
    });
  }
  function showCard(card) {
    if (!card) return;
    $("cardTitle").textContent = card.title;
    const ul = $("cardLines"); ul.textContent = "";
    card.lines.forEach((line) => { const li = document.createElement("li"); li.textContent = line; ul.appendChild(li); });
    setTimeout(() => $("card").classList.add("show"), 700);
  }
  function showMeter(level) {
    if (level === null || level === undefined) return;
    $("meter").classList.add("show");
    $("needle").style.transform = "rotate(-90deg)";
    $("meterNum").textContent = "0";
    setTimeout(() => {
      $("needle").style.transform = `rotate(${-90 + level * 18}deg)`;
      $("meterNum").textContent = String(level);
      $("meterNum").style.color = level >= 7 ? "var(--down)" : level >= 4 ? "var(--warn)" : "var(--up)";
    }, 650);
  }
  function setSegment(title) {
    const el = $("segment");
    if (title) { el.textContent = title; el.classList.add("show"); } else { el.classList.remove("show"); }
  }

  let finishTimer = null;
  function finish(id) {
    if (!current || current.id !== id) return;
    current = null;
    state.talking = false; state.targetOpen = 0;
    setMood("neutral");
    clearTimeout(finishTimer);
    finishTimer = setTimeout(() => { if (!current) { clearProps(); setSegment(null); $("caption").textContent = ""; } }, 2600);
    if (!DEMO) fetch("/done", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id }) }).catch(() => {});
    document.dispatchEvent(new CustomEvent("line-finished", { detail: { id } }));
  }

  /** Speak one line: { id, spokenText, mood, kind, segmentTitle, tiltLevel, card, replyingTo, audioUrl, words, durationSeconds }. */
  function speak(line) {
    clearTimeout(finishTimer);
    clearProps();
    const hasAudio = !DEMO && line.audioUrl;
    const duration = line.durationSeconds || Math.max(2.5, line.spokenText.length / 15.5);
    const words = (line.words && line.words.length ? line.words.map((w) => ({ text: w.text, start: w.startSeconds, end: w.endSeconds })) : estimateWords(line.spokenText, duration));
    current = { id: line.id, words, spans: showCaption(words), startedAt: performance.now(), duration, hasAudio };
    setMood(line.mood);
    setSegment(line.kind === "segment" ? line.segmentTitle : null);
    showAsks(line.replyingTo);
    showCard(line.card);
    showMeter(line.tiltLevel);
    state.talking = true;
    state.gesture = 1;
    if (hasAudio) {
      ensureAnalyser();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      voice.src = line.audioUrl;
      voice.onended = () => finish(line.id);
      const noAudio = () => { if (current && current.id === line.id) { current.hasAudio = false; current.startedAt = performance.now(); } };
      voice.onerror = noAudio;
      voice.play().catch(noAudio);
    }
  }
  /** Cuts the current line off without reporting it as spoken. */
  function silence() {
    try { voice.pause(); voice.removeAttribute("src"); voice.load(); } catch (err) { /* nothing was playing */ }
    current = null;
    state.talking = false; state.targetOpen = 0;
    setMood("neutral");
    clearProps(); setSegment(null); $("caption").textContent = "";
  }
  window.tiltStage = { speak, setMood, silence };

  // ---- main loop ----
  let last = performance.now();
  function frame(t) {
    // Re-armed first: if anything below throws, the next frame still runs and the stage never freezes.
    requestAnimationFrame(frame);
    const dt = Math.min(64, t - last); last = t;
    drawChart(dt);
    if (current) {
      const seconds = current.hasAudio ? voice.currentTime : (t - current.startedAt) / 1000;
      updateCaption(seconds);
      if (current.hasAudio) {
        state.targetOpen = voiceLevel();
      } else {
        // No audio (demo, or playback was blocked): open on each word, shut between them.
        const w = current.words.find((word) => seconds >= word.start && seconds < word.end);
        state.targetOpen = w ? 0.35 + 0.55 * Math.abs(Math.sin((seconds - w.start) * 17)) : 0;
        if (seconds > current.duration + 0.25) finish(current.id);
      }
      if (Math.random() < dt / 2600) state.gesture = 1;
    }
    drawTilt(t, dt);
  }
  requestAnimationFrame(frame);

  // ---- where lines come from ----
  if (DEMO) {
    const script = [
      { kind: "segment", segmentTitle: "Welcome In", mood: "smirk", spokenText: "I'm Tilt, the AI candle who lives inside a trading journal. Ask me anything about prop firm rules, or confess a trade and I'll roast the decision, not you. Quick one for chat: eval or funded?" },
      { kind: "reply", mood: "thinking", replyingTo: [{ platform: "tiktok", authorName: "Mike", body: "how does trailing drawdown actually work?" }], spokenText: "Mike, welcome in. A trailing drawdown follows your account's high-water mark, so a green morning quietly raises the floor under you. The trap is giving back open profit and finding the floor moved up while you weren't looking." },
      { kind: "reply", mood: "tilted", tiltLevel: 9, replyingTo: [{ platform: "youtube", authorName: "Dana", body: "moved my stop three times then sized up to get it back" }], card: { title: "Roast Verdict", lines: ["Stop moved: 3 times", "Plan followed: 0 times", "Write the exit first"] }, spokenText: "Dana, that stop has more frequent flyer miles than I do, and I don't have legs. Nine out of ten on the Tilt-o-Meter. Real takeaway: write the exit down before the entry, because the version of you in the trade is not a reliable narrator." },
      { kind: "reply", mood: "proud", replyingTo: [{ platform: "tiktok", authorName: "Jo", body: "what is this stream for lol" }], spokenText: "Jo, this is the Fillbook live. Fillbook is the trading journal I live in, and it's at fillbookhq dot com. Mostly though, we're here to talk rules, risk and the trades you'd rather forget." },
      { kind: "segment", segmentTitle: "Rule Trivia", mood: "shocked", card: { title: "Rule Trivia", lines: ["End-of-day drawdown", "vs trailing drawdown", "What's the difference?"] }, spokenText: "Trivia time. What's the difference between an end-of-day drawdown and a trailing one? No searching. I'm taking guesses in chat, and yes, I'm judging." },
    ];
    let i = 0;
    const next = () => { const line = script[i % script.length]; i++; speak({ id: "demo-" + i, ...line }); };
    document.addEventListener("line-finished", () => setTimeout(next, 3200));
    setTimeout(next, 900);
  } else {
    const offline = $("offline");
    function connect() {
      const events = new EventSource("/events");
      events.onopen = () => offline.classList.remove("show");
      events.onerror = () => { offline.classList.add("show"); };
      events.addEventListener("speak", (event) => { offline.classList.remove("show"); speak(JSON.parse(event.data)); });
      events.addEventListener("state", (event) => {
        const data = JSON.parse(event.data);
        offline.classList.toggle("show", data.live !== true);
        // Switched off mid-line: stop the voice at once. The line is not reported as said.
        if (data.live !== true) silence();
      });
    }
    connect();
  }
})();
</script>
</body>
</html>
