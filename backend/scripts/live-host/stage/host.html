<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilt co-host console</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --mute:#8b93a5; --accent:#f5a524; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:17px; margin:0 0 4px; }
  p.sub { margin:0 0 14px; color:var(--mute); }
  .status { display:inline-block; padding:2px 8px; border-radius:99px; background:var(--card); border:1px solid var(--line); font-size:12px; color:var(--mute); }
  .status.on { color:#4ade80; border-color:#14532d; }
  form { display:grid; gap:8px; margin:12px 0; }
  textarea, input { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  textarea { min-height:72px; resize:vertical; }
  .row { display:flex; gap:8px; }
  button { padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#1a1200; font-weight:600; cursor:pointer; }
  select { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  .showbar { margin:10px 0 14px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .clock { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; font-size:13px; color:var(--mute); }
  .clock .hint { color:var(--accent); text-align:right; }
  .talkbar { display:flex; gap:10px; align-items:center; margin:0 0 12px; }
  .talk { min-width:140px; padding:14px 18px; font-size:15px; background:var(--card); color:var(--text); border:1px solid var(--line); user-select:none; touch-action:none; }
  .talk.live { background:#b42318; color:#fff; border-color:#b42318; }
  .hearing { flex:1; font-size:13px; color:var(--mute); min-height:1.3em; }
  .hearing.live { color:var(--text); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip { padding:6px 12px; border-radius:99px; background:var(--card); color:var(--text); border:1px solid var(--line); font-weight:500; font-size:13px; }
  button.secondary { background:var(--card); color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .log { display:grid; gap:6px; margin-top:14px; }
  .item { padding:8px 10px; border-radius:8px; background:var(--card); border:1px solid var(--line); }
  .item .who { font-size:12px; color:var(--mute); }
  .item.tilt { border-left:3px solid var(--accent); }
  .err { color:#f87171; min-height:1.2em; font-size:13px; }
</style>
</head>
<body>
  <h1>Tilt co-host console</h1>
  <p class="sub">Type what you want Tilt to answer. He only speaks when you send something. <span id="status" class="status">connecting</span></p>

  <div class="showbar" aria-label="Run of show">
    <div class="clock"><span id="showClock">Show not started</span><span id="showHint" class="hint"></span></div>
    <div class="row">
      <button id="openShow" type="button">Open the show</button>
      <button id="closeShow" type="button" class="secondary">Close the show</button>
    </div>
  </div>

  <div class="talkbar">
    <button id="talk" type="button" class="talk" aria-pressed="false">Hold to talk</button>
    <div class="hearing" id="hearing" aria-live="polite">Hold the button, or hold Space, and talk to Tilt. Release to send. Esc cancels.</div>
  </div>

  <form id="form">
    <textarea id="text" maxlength="400" placeholder="Say something to Tilt, or paste a viewer's question below" autofocus></textarea>
    <input id="from" maxlength="40" placeholder="Viewer's name (only when relaying a viewer's question)">
    <div class="row"><button id="send" type="submit">Send to Tilt</button></div>
    <div id="err" class="err" role="status"></div>
  </form>

  <div class="chips" aria-label="Quick prompts">
    <button type="button" class="chip" data-text="Tilt, tease me about something I just said.">Tease me</button>
    <button type="button" class="chip" data-text="Tilt, ask me one quick question I can answer in a sentence.">Ask me something</button>
    <button type="button" class="chip" data-text="Tilt, hype up the room in one line and ask them to type something.">Hype the room</button>
    <button type="button" class="chip" data-text="Tilt, say that again but simpler, like I'm new.">Say it simpler</button>
    <button type="button" class="chip" data-text="Tilt, give me your hottest take on a harmless topic, not trading.">Hot take</button>
    <button type="button" class="chip" data-text="Tilt, we need a bit. Do a one-line roast of my pre-market routine.">Roast my routine</button>
  </div>
  <div class="row">
    <select id="segment" aria-label="Segment to run"><option value="">Next in rotation</option></select>
    <button id="runSegment" type="button" class="secondary">Run a segment</button>
  </div>
  <div id="segErr" class="err" role="status"></div>

  <div id="log" class="log"></div>

<script>
  var statusEl = document.getElementById("status");
  var logEl = document.getElementById("log");
  var errEl = document.getElementById("err");
  var textEl = document.getElementById("text");
  var fromEl = document.getElementById("from");
  var sendEl = document.getElementById("send");

  function addItem(cls, who, text) {
    var item = document.createElement("div");
    item.className = "item " + cls;
    var w = document.createElement("div");
    w.className = "who";
    w.textContent = who;
    var t = document.createElement("div");
    t.textContent = text;
    item.appendChild(w);
    item.appendChild(t);
    logEl.insertBefore(item, logEl.firstChild);
    while (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
  }

  document.getElementById("form").addEventListener("submit", function (event) {
    event.preventDefault();
    var text = textEl.value.trim();
    if (!text) return;
    var from = fromEl.value.trim();
    sendEl.disabled = true;
    errEl.textContent = "";
    fetch("/ask", {
      method: "POST",
      headers: { "content-type": "application/json", "x-live-host": "1" },
      body: JSON.stringify(from ? { text: text, relayedFrom: from } : { text: text })
    }).then(function (res) {
      if (res.status === 202) {
        addItem("", from ? "You, relaying " + from : "You", text);
        textEl.value = "";
        textEl.focus();
      } else if (res.status === 429) {
        errEl.textContent = "Tilt has a queue already. Give him a moment.";
      } else {
        errEl.textContent = "Could not send (HTTP " + res.status + ").";
      }
    }).catch(function () {
      errEl.textContent = "Could not reach the worker. Is npm run live-host running?";
    }).then(function () { sendEl.disabled = false; });
  });

  textEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      document.getElementById("form").requestSubmit();
    }
  });

  function sendPrompt(text, label) {
    errEl.textContent = "";
    return fetch("/ask", {
      method: "POST",
      headers: { "content-type": "application/json", "x-live-host": "1" },
      body: JSON.stringify({ text: text })
    }).then(function (res) {
      if (res.status === 202) addItem("", "You", label || text);
      else if (res.status === 429) errEl.textContent = "Tilt has a queue already. Give him a moment.";
      else errEl.textContent = "Could not send (HTTP " + res.status + ").";
    }).catch(function () {
      errEl.textContent = "Could not reach the worker. Is npm run live-host running?";
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (chip) {
    chip.addEventListener("click", function () {
      chip.disabled = true;
      sendPrompt(chip.getAttribute("data-text"), chip.textContent).then(function () {
        setTimeout(function () { chip.disabled = false; }, 4000);
      });
    });
  });

  // ---- voice: push to talk, using the browser's own speech recognition (free, nothing to install) ----
  // Push to talk on purpose: it only listens while you hold the button or Space, so it never picks up Tilt's own
  // voice or the room, and nothing is sent that you did not just say. Release sends it; Esc throws it away.
  (function setupVoice() {
    var talkBtn = document.getElementById("talk");
    var hearing = document.getElementById("hearing");
    var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var idleText = hearing.textContent;
    if (!Recognition) {
      talkBtn.disabled = true;
      hearing.textContent = "Voice input needs Chrome or Edge. You can still type.";
      return;
    }
    var recognition = null;
    var holding = false;
    var cancelled = false;
    var finalText = "";
    var interimText = "";

    function setLive(on) {
      talkBtn.classList.toggle("live", on);
      talkBtn.setAttribute("aria-pressed", on ? "true" : "false");
      talkBtn.textContent = on ? "Listening..." : "Hold to talk";
      hearing.classList.toggle("live", on);
    }

    function start() {
      if (holding) return;
      holding = true;
      cancelled = false;
      finalText = "";
      interimText = "";
      setLive(true);
      hearing.textContent = "Listening...";
      recognition = new Recognition();
      recognition.lang = "en-US";
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.onresult = function (event) {
        var finals = "";
        var interims = "";
        for (var i = 0; i < event.results.length; i++) {
          var piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) finals += piece + " ";
          else interims += piece;
        }
        finalText = finals;
        interimText = interims;
        hearing.textContent = (finals + interims).trim() || "Listening...";
      };
      recognition.onerror = function (event) {
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          hearing.textContent = "The browser blocked the microphone. Allow it for this page, then try again.";
        } else if (event.error === "no-speech") {
          hearing.textContent = "Did not hear anything.";
        } else if (event.error === "network") {
          hearing.textContent = "Speech recognition could not reach its service. You can still type.";
        } else if (event.error !== "aborted") {
          hearing.textContent = "Voice input problem (" + event.error + ").";
        }
      };
      recognition.onend = function () {
        var text = (finalText + " " + interimText).replace(/\s+/g, " ").trim();
        holding = false;
        setLive(false);
        recognition = null;
        if (cancelled) { hearing.textContent = "Cancelled."; return; }
        if (text.length < 3) { if (hearing.textContent === "Listening...") hearing.textContent = idleText; return; }
        hearing.textContent = "Sent: " + text;
        sendPrompt(text.slice(0, 400), "You (voice): " + text.slice(0, 400));
      };
      try {
        recognition.start();
      } catch (err) {
        holding = false;
        setLive(false);
        hearing.textContent = "Could not start the microphone.";
      }
    }

    function stop(cancel) {
      if (!holding || !recognition) return;
      if (cancel) cancelled = true;
      try { recognition.stop(); } catch (err) { /* already stopped */ }
    }

    talkBtn.addEventListener("pointerdown", function (event) { event.preventDefault(); start(); });
    talkBtn.addEventListener("pointerup", function () { stop(false); });
    talkBtn.addEventListener("pointerleave", function () { stop(false); });
    document.addEventListener("keydown", function (event) {
      var tag = (event.target && event.target.tagName) || "";
      var typing = tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT";
      if (event.key === "Escape") { stop(true); return; }
      if (event.code === "Space" && !typing && !event.repeat) { event.preventDefault(); start(); }
    });
    document.addEventListener("keyup", function (event) {
      if (event.code === "Space" && holding) { event.preventDefault(); stop(false); }
    });
  })();

  // ---- run of show: a clock and the two beats that frame the stream ----
  var showStartedAt = null;
  var lastBeatAt = null;
  var clockEl = document.getElementById("showClock");
  var hintEl = document.getElementById("showHint");
  function fmt(ms) {
    var total = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(total / 60), s = total % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function tickClock() {
    if (showStartedAt === null) { clockEl.textContent = "Show not started"; hintEl.textContent = "Press Open the show"; return; }
    var now = Date.now();
    clockEl.textContent = "On air " + fmt(now - showStartedAt) + "  |  last beat " + fmt(now - lastBeatAt) + " ago";
    var quiet = now - lastBeatAt;
    hintEl.textContent = quiet > 240000 ? "A segment is due" : quiet > 150000 ? "Segment soon" : "";
  }
  setInterval(tickClock, 1000);
  tickClock();
  function noteBeat() { lastBeatAt = Date.now(); if (showStartedAt === null) showStartedAt = lastBeatAt; }
  function pressBeat(id, label, button) {
    button.disabled = true;
    fetch("/segment", {
      method: "POST",
      headers: { "content-type": "application/json", "x-live-host": "1" },
      body: JSON.stringify({ id: id })
    }).then(function (res) {
      if (res.status === 202) { addItem("", "You", label); noteBeat(); if (id === "show_open") showStartedAt = Date.now(); }
      else if (res.status === 429) segErr.textContent = "A segment is already on its way.";
      else segErr.textContent = "Could not start it (HTTP " + res.status + ").";
    }).catch(function () {
      segErr.textContent = "Could not reach the worker. Is npm run live-host running?";
    }).then(function () { setTimeout(function () { button.disabled = false; }, 4000); });
  }
  document.getElementById("openShow").addEventListener("click", function () { pressBeat("show_open", "Open the show", this); });
  document.getElementById("closeShow").addEventListener("click", function () { pressBeat("show_close", "Close the show", this); });

  var segEl = document.getElementById("segment");
  var segBtn = document.getElementById("runSegment");
  var segErr = document.getElementById("segErr");
  fetch("/host-segments").then(function (res) { return res.json(); }).then(function (list) {
    list.forEach(function (choice) {
      var option = document.createElement("option");
      option.value = choice.id;
      option.textContent = choice.title;
      segEl.appendChild(option);
    });
  }).catch(function () {});
  segBtn.addEventListener("click", function () {
    segBtn.disabled = true;
    segErr.textContent = "";
    var title = segEl.options[segEl.selectedIndex].textContent;
    fetch("/segment", {
      method: "POST",
      headers: { "content-type": "application/json", "x-live-host": "1" },
      body: JSON.stringify(segEl.value ? { id: segEl.value } : {})
    }).then(function (res) {
      if (res.status === 202) { addItem("", "You", "Run segment: " + title); noteBeat(); }
      else if (res.status === 429) segErr.textContent = "A segment is already on its way.";
      else segErr.textContent = "Could not start a segment (HTTP " + res.status + ").";
    }).catch(function () {
      segErr.textContent = "Could not reach the worker. Is npm run live-host running?";
    }).then(function () { setTimeout(function () { segBtn.disabled = false; }, 3000); });
  });

  var source = new EventSource("/host-events");
  source.addEventListener("state", function (event) {
    var data = JSON.parse(event.data);
    statusEl.textContent = data.live ? "Tilt is live" : "Tilt is off (switch it on in the app)";
    statusEl.className = "status" + (data.live ? " on" : "");
  });
  source.addEventListener("speak", function (event) {
    var data = JSON.parse(event.data);
    addItem("tilt", "Tilt", data.spokenText);
  });
  source.onerror = function () { statusEl.textContent = "reconnecting"; statusEl.className = "status"; };
</script>
</body>
</html>
