<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilt Live Control</title>
<style>
  :root { --bg: #0b1424; --card: #101b30; --line: #24324d; --ink: #f3f7ff; --ink2: #9fb0cf; --accent: #22d3ee; --bad: #ff5d73; --ok: #2dd4a7; --warn: #ffb547; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 "Segoe UI", system-ui, sans-serif; padding: 16px; max-width: 760px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .status { display: flex; gap: 10px; align-items: center; font-weight: 700; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink2); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0 0; color: var(--ink2); }
  dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  button, select { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: #16233d; color: var(--ink); padding: 10px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { background: #3a1420; border-color: var(--bad); font-weight: 800; }
  button.on { border-color: var(--ok); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row select { flex: 1; }
  #msg { color: var(--ink2); min-height: 1.4em; }
</style>
</head>
<body>
<h1>Tilt Live Control</h1>

<div class="card">
  <div class="status"><span class="dot" id="dot"></span><span id="state">Connecting...</span></div>
  <dl id="facts"></dl>
</div>

<div class="card">
  <div class="grid">
    <button data-a="pause">Pause speaking</button>
    <button data-a="resume">Resume</button>
    <button data-a="mute">Mute audio</button>
    <button data-a="unmute">Unmute</button>
    <button data-a="interrupt">Interrupt current</button>
    <button data-a="skip">Skip segment</button>
    <button data-a="chat_off">Chat replies off</button>
    <button data-a="chat_on">Chat replies on</button>
    <button data-a="promos_off">Promos off</button>
    <button data-a="promos_on">Promos on</button>
  </div>
  <div class="row">
    <select id="topic"><option value="">Next topic: let the rundown choose</option></select>
    <button id="runTopic">Run it</button>
  </div>
</div>

<div class="card">
  <button class="danger" data-a="emergency_stop" style="width:100%">EMERGENCY STOP (silence, stop the stream, stay paused)</button>
</div>
<div id="msg"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem("liveHostToken") || "";
  const headers = () => ({ "content-type": "application/json", "x-live-host": "1", ...(token ? { "x-live-host-token": token } : {}) });
  async function health() {
    try {
      const res = await fetch("/health", { headers: headers(), cache: "no-store" });
      if (res.status === 403) {
        const entered = prompt("Control token (LIVE_HOST_CONTROL_TOKEN):");
        if (entered) { token = entered; sessionStorage.setItem("liveHostToken", token); }
        throw new Error("not authorised");
      }
      return await res.json();
    } catch (err) { return null; }
  }
  function render(h) {
    const dot = $("dot");
    if (!h) { dot.className = "dot bad"; $("state").textContent = "Worker not reachable"; return; }
    dot.className = "dot " + (h.status === "ok" ? "ok" : h.status === "off" ? "" : "warn");
    $("state").textContent = { ok: "On air, healthy", off: "Off air", degraded: "Degraded: server not answering", "no-stage": "No stage page connected", "emergency-stopped": "EMERGENCY STOPPED" }[h.status] || h.status;
    const rows = [
      ["Speaking", h.speaking || "nothing"], ["Waiting line", h.waitingLine || "none"], ["Last good tick", h.secondsSinceLastGoodTick === null ? "never" : h.secondsSinceLastGoodTick + " s ago"],
      ["Tick failures in a row", h.consecutiveTickFailures], ["Paused", h.controls.paused], ["Muted", h.controls.muted], ["Chat replies", h.controls.chat ? "on" : "OFF"],
      ["Promos", h.controls.promos ? "on" : "OFF"], ["Stage pages", h.stageClients], ["OBS", h.obsConnected ? "connected" : "not connected"], ["Recording", h.recording ? "on" : "off"],
      ["Spend today", h.spendTodayUsd === null ? "unknown" : "$" + Number(h.spendTodayUsd).toFixed(2)], ["Note", h.lastNote || "none"], ["Uptime", Math.round(h.uptimeSeconds / 60) + " min"],
    ];
    $("facts").innerHTML = "";
    for (const [k, v] of rows) { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = String(v); $("facts").append(dt, dd); }
    const select = $("topic");
    if (select.options.length === 1 && Array.isArray(h.segments)) for (const s of h.segments) { const o = document.createElement("option"); o.value = s.id; o.textContent = s.title; select.append(o); }
  }
  async function act(action, extra) {
    if (action === "emergency_stop" && !confirm("Emergency stop: silence Tilt, stop the stream and stay paused?")) return;
    try {
      const res = await fetch("/control", { method: "POST", headers: headers(), body: JSON.stringify({ action, ...extra }) });
      $("msg").textContent = res.ok ? "Done: " + action : "Refused (" + res.status + ")";
    } catch (err) { $("msg").textContent = "Worker not reachable"; }
    render(await health());
  }
  document.querySelectorAll("button[data-a]").forEach((b) => b.addEventListener("click", () => act(b.dataset.a)));
  $("runTopic").addEventListener("click", () => act("topic", { id: $("topic").value || undefined }));
  async function loop() { render(await health()); setTimeout(loop, 2000); }
  loop();
</script>
</body>
</html>
