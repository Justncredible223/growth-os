name: Video Render

# Triggered by a Supabase Edge Function (supabase/functions/trigger-video-render)
# via repository_dispatch when a render_video system_job is inserted.
# Also supports manual dispatch for debugging a specific render.

on:
  repository_dispatch:
    types: [video-render]
  workflow_dispatch:
    inputs:
      videoRenderId:
        description: "video_renders.id"
        required: true
        type: string
      campaignAssetId:
        description: "campaign_assets.id"
        required: true
        type: string

concurrency:
  # One render per video at a time; never cancel a running render.
  group: video-render-${{ github.event.client_payload.videoRenderId || inputs.videoRenderId }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Cache ffmpeg packages
        # The apt download from the Azure mirror hangs often enough to fail merges (2026-10-22, three times on 2026-10-26). The
        # .deb files are cached after one successful install and installed offline on later runs; the network install below is
        # only the fallback (first run, a new runner image, or a cache miss). The key includes the runner image version, so a
        # new image refreshes the cache instead of installing stale dependency versions.
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-v1-${{ runner.os }}-${{ env.ImageVersion }}

      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/ffmpeg-debs"
          if ls "$HOME"/ffmpeg-debs/*.deb >/dev/null 2>&1; then
            echo "installing ffmpeg from the cached packages"
            if sudo dpkg -i "$HOME"/ffmpeg-debs/*.deb && ffmpeg -version | head -1; then exit 0; fi
            echo "cached install failed, falling back to the network"
          fi
          # Keep the downloaded .deb files (the runner image deletes them after install by default) so they can be cached.
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          for attempt in 1 2 3; do
            if [ "$attempt" = "2" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            fi
            if sudo timeout 45 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update               && sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends ffmpeg; then
              ffmpeg -version | head -1
              sudo cp /var/cache/apt/archives/*.deb "$HOME/ffmpeg-debs/" 2>/dev/null || true
              sudo chown -R "$USER" "$HOME/ffmpeg-debs" 2>/dev/null || true
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out"
            sleep 5
          done
          echo "::error::ffmpeg could not be installed after 3 attempts"
          exit 1

      - name: Install edge-tts (voiceover)
        run: pip install --disable-pip-version-check edge-tts

      # npm ci installs exactly package-lock.json from setup-node's cache (npm install re-resolves and rewrites the
      # lock file on every render for no benefit; CI already uses npm ci on the same lock file).
      - name: npm ci
        working-directory: backend
        run: npm ci --no-audit --no-fund

      # The Chromium download (~150 MB) is cached per lock file; "install --with-deps" below still installs the OS
      # libraries on a fresh runner but skips the download on a cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Chromium (HTML product-mock slides)
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Render video
        working-directory: backend
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIDEO_RENDER_ID: ${{ github.event.client_payload.videoRenderId || inputs.videoRenderId }}
          CAMPAIGN_ASSET_ID: ${{ github.event.client_payload.campaignAssetId || inputs.campaignAssetId }}
          FIREBASE_SERVICE_ACCOUNT_JSON_PATH: /tmp/firebase-sa.json
          VIDEO_WORKER_WORK_DIR: /tmp/fillbook-renders
        run: npx tsx scripts/video-worker/render-single.ts

      # Backstop for failures render-single.ts never gets to report itself: a
      # setup step failing (apt/npm/pip), the 30-minute timeout, or a
      # cancelled run. Without this the video_renders row stays 'queued' or
      # 'rendering' forever, because the trigger function already marked the
      # job done the moment it dispatched. render-single.ts writes its own
      # real error on any failure it can catch, and this only touches a row
      # still queued/rendering, so it never overwrites that.
      - name: Mark render failed if the run died early
        if: failure() || cancelled()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VIDEO_RENDER_ID: ${{ github.event.client_payload.videoRenderId || inputs.videoRenderId }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$VIDEO_RENDER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "VIDEO_RENDER_ID is not a UUID, skipping"
            exit 0
          fi
          curl -sS -X PATCH             "https://aijnibayogdygtykidta.supabase.co/rest/v1/video_renders?id=eq.${VIDEO_RENDER_ID}&status=in.(queued,rendering)"             -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Content-Type: application/json"             -d "{\"status\":\"failed\",\"error\":\"Render workflow stopped before it could report a result. See ${RUN_URL}\"}"

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/firebase-sa.json
