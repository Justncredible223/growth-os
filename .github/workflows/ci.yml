name: CI

# Typecheck and tests for the backend on every pull request. Before this existed nothing ran the test suite
# anywhere: PRs only got Vercel's build check.
#
# Deliberately uses no secrets and only the plain `pull_request` trigger (never `pull_request_target`): this repo is
# public, and a workflow that ran a fork's code with secrets available would hand those secrets out.

on:
  # Only changes that can affect the backend (its code, tests, lock file, or this workflow) run the suite: an
  # Android-only or docs-only PR has nothing here to test and used to install ffmpeg + Chromium for nothing.
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  # Every backend merge to master is tested too, so master's status is visible without triggering it by hand.
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR replaces the older run instead of queueing behind it. Runs on master are never
  # cancelled, so every merged commit gets its own result.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # Same tools the real render workflow installs (video-render.yml), because the render tests exercise them.
      - name: Cache ffmpeg packages
        # The apt download from the Azure mirror hangs often enough to fail merges (2026-10-22, three times on 2026-10-26). The
        # .deb files are cached after one successful install and installed offline on later runs; the network install below is
        # only the fallback (first run, a new runner image, or a cache miss). The key includes the runner image version, so a
        # new image refreshes the cache instead of installing stale dependency versions.
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-v1-${{ runner.os }}-${{ env.ImageVersion }}

      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/ffmpeg-debs"
          if ls "$HOME"/ffmpeg-debs/*.deb >/dev/null 2>&1; then
            echo "installing ffmpeg from the cached packages"
            if sudo dpkg -i "$HOME"/ffmpeg-debs/*.deb && ffmpeg -version | head -1; then exit 0; fi
            echo "cached install failed, falling back to the network"
          fi
          # Keep the downloaded .deb files (the runner image deletes them after install by default) so they can be cached.
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          for attempt in 1 2 3; do
            if [ "$attempt" = "2" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            fi
            if sudo timeout 45 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update               && sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends ffmpeg; then
              ffmpeg -version | head -1
              sudo cp /var/cache/apt/archives/*.deb "$HOME/ffmpeg-debs/" 2>/dev/null || true
              sudo chown -R "$USER" "$HOME/ffmpeg-debs" 2>/dev/null || true
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out"
            sleep 5
          done
          echo "::error::ffmpeg could not be installed after 3 attempts"
          exit 1

      - name: Install edge-tts
        run: pip install --disable-pip-version-check edge-tts

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      # The mock-slide tests render real slides in headless Chromium (they skip themselves where none is installed).
      # The download has hung for 10+ minutes on its own (2026-10-27, twice); cap each try at 4 minutes and try up to 3 times.
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Chromium install attempt $attempt failed or timed out"
          done
          exit 1
        timeout-minutes: 15

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
