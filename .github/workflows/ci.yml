name: CI

# Typecheck and tests for the backend on every pull request. Before this existed nothing ran the test suite
# anywhere: PRs only got Vercel's build check.
#
# Deliberately uses no secrets and only the plain `pull_request` trigger (never `pull_request_target`): this repo is
# public, and a workflow that ran a fork's code with secrets available would hand those secrets out.

on:
  # Only changes that can affect the backend (its code, tests, lock file, or this workflow) run the suite: an
  # Android-only or docs-only PR has nothing here to test and used to install ffmpeg + Chromium for nothing.
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  # Every backend merge to master is tested too, so master's status is visible without triggering it by hand.
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR replaces the older run instead of queueing behind it. Runs on master are never
  # cancelled, so every merged commit gets its own result.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # Same tools the real render workflow installs (video-render.yml), because the render tests exercise them.
      - name: Install ffmpeg
        # Hardened 2026-10-22: on 2026-10-22 this step hung for 14+ minutes (a stalled package download; it normally takes about
        # 20 seconds) and an approved render sat 'queued' until it was cancelled by hand. A step timeout plus per-command
        # timeouts and up to 3 attempts turns a stall into a quick retry, and a real failure into a fast, visible one.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update               && sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y ffmpeg; then
              ffmpeg -version | head -1
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out"
            sleep 10
          done
          echo "::error::ffmpeg could not be installed after 3 attempts"
          exit 1

      - name: Install edge-tts
        run: pip install --disable-pip-version-check edge-tts

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      # The mock-slide tests render real slides in headless Chromium (they skip themselves where none is installed).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
