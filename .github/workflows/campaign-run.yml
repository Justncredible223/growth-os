name: Campaign Run

# Triggered by a Supabase Edge Function (supabase/functions/trigger-campaign-run)
# via repository_dispatch when a run_campaign system_job is inserted.
# Also supports manual dispatch for debugging a specific run.
#
# Runs the draft -> mechanical gate -> nine-agent deep review pipeline
# (backend/src/content/runCampaignForOpportunity.ts) that api/run-campaign.ts
# used to run inline inside the HTTP request, moved here because that
# request occasionally exceeded Vercel's 120s function cap. No comparable
# duration ceiling here -- same reasoning as video-render.yml's own offload.

on:
  repository_dispatch:
    types: [campaign-run]
  workflow_dispatch:
    inputs:
      campaignRunRequestId:
        description: "campaign_run_requests.id"
        required: true
        type: string
      opportunityId:
        description: "opportunities.id"
        required: true
        type: string
      assetTypeOverride:
        description: "video_script | research | (blank for the opportunity's own recommended channel)"
        required: false
        type: string

concurrency:
  # One run per request at a time; never cancel a running one.
  group: campaign-run-${{ github.event.client_payload.campaignRunRequestId || inputs.campaignRunRequestId }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: npm install
        working-directory: backend
        run: npm install

      # Lets run-single.ts push "script ready to approve". Harmless when the secret is missing: the push is skipped.
      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Run campaign
        working-directory: backend
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_PATH: /tmp/firebase-sa.json
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          CAMPAIGN_RUN_REQUEST_ID: ${{ github.event.client_payload.campaignRunRequestId || inputs.campaignRunRequestId }}
          OPPORTUNITY_ID: ${{ github.event.client_payload.opportunityId || inputs.opportunityId }}
          ASSET_TYPE_OVERRIDE: ${{ github.event.client_payload.assetTypeOverride || inputs.assetTypeOverride }}
        run: npx tsx scripts/campaign-worker/run-single.ts

      # Backstop for failures run-single.ts never gets to report itself: a
      # setup step failing (npm install), the 15-minute timeout, or a
      # cancelled run. Without this the campaign_run_requests row stays
      # 'queued' or 'running' forever, because the trigger function already
      # marked the job done the moment it dispatched. Same pattern as
      # video-render.yml's own backstop step.
      - name: Mark run failed if the workflow died early
        if: failure() || cancelled()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAMPAIGN_RUN_REQUEST_ID: ${{ github.event.client_payload.campaignRunRequestId || inputs.campaignRunRequestId }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$CAMPAIGN_RUN_REQUEST_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "CAMPAIGN_RUN_REQUEST_ID is not a UUID, skipping"
            exit 0
          fi
          curl -sS -X PATCH             "https://aijnibayogdygtykidta.supabase.co/rest/v1/campaign_run_requests?id=eq.${CAMPAIGN_RUN_REQUEST_ID}&status=in.(queued,running)"             -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Content-Type: application/json"             -d "{\"status\":\"failed\",\"error\":\"Campaign run workflow stopped before it could report a result. See ${RUN_URL}\"}"
